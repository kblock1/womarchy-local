# Monthly, grouped updates: one pull request per ecosystem at most.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /windows/omarchy
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
