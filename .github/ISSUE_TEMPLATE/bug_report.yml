name: Bug report
description: Something doesn't work in Omarchy on WSL (install, startup, display, input, clipboard, updates, ...)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The [troubleshooting guide](https://github.com/sytelus/womarchy/blob/main/docs/TROUBLESHOOTING.md) covers common problems.
        Problems with Omarchy itself that also happen outside WSL belong to [Omarchy](https://github.com/basecamp/omarchy/issues).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I ran `omarchy` and ...
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `omarchy status`
      description: Run it in a Windows terminal (PowerShell or cmd) and paste the output.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If the desktop starts or fails to start: the last ~50 lines of `~/.cache/womarchy/session.log` and `~/.cache/womarchy/hyprland.log` (get a shell with `wsl -d Omarchy`).
        For install problems: what the installer printed.
      render: text
  - type: input
    id: hardware
    attributes:
      label: GPU and monitors
      placeholder: e.g. NVIDIA RTX 4070, two 4K monitors at 150%
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed anything private from the logs (user names, host names, paths, tokens).
          required: true
