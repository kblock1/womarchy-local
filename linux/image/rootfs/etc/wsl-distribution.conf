# womarchy (Omarchy on WSL). See https://learn.microsoft.com/windows/wsl/build-custom-distro
[oobe]
command = /usr/lib/womarchy/oobe.sh
# The first-run setup creates the desktop user with this UID. Distro cgroups are
# isolated on WSL >= 2.9, so sharing UID 1000 with other distros is harmless there.
defaultUid = 1000
defaultName = Omarchy

[shortcut]
# omarchy.exe install creates the "Omarchy" Start-menu entry that starts the
# desktop; a WSL shell shortcut with the same name would duplicate it.
enabled = false
icon = /usr/lib/womarchy/omarchy.ico

[windowsterminal]
enabled = true
