# womarchy (Omarchy on WSL). See https://learn.microsoft.com/windows/wsl/wsl-config
[boot]
systemd=true

[interop]
enabled=true
# Keeps PATH (and so shells, uwsm and the session) free of /mnt/c entries.
# Windows programs still run by full path, e.g. /mnt/c/Windows/explorer.exe.
appendWindowsPath=false

[network]
# WSL writes /etc/resolv.conf; systemd-resolved and NetworkManager stay masked.
generateResolvConf=true

# [user] default=<name> is written by the first-run setup (/usr/lib/womarchy/oobe.sh).
