# Minimal Hyprland config for testing the wsl backend (not Omarchy's config).
monitor = , preferred, auto, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

debug {
    disable_logs = false
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = rgb(33ccff) rgb(00ff99) 45deg
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}

animations {
    enabled = true
}

input {
    kb_layout = us
}

env = GALLIUM_DRIVER,d3d12

exec-once = foot
exec-once = es2gears_wayland > $HOME/.cache/womarchy/gears.log 2>&1

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
